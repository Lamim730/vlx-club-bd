<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E1A17">
<title>VLX CLUB BD</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1A17;--sf:#16271F;--ln:#26402F;--tx:#EAF2EE;--mu:#8FA89B;--rd:#F42A41;--gd:#F5C451;--gr:#1E9E6A}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Hind Siliguri",sans-serif;padding-bottom:76px}
.wrap{max-width:560px;margin:auto;padding:16px}
h1,h2,.num{font-family:Teko,sans-serif;font-weight:700;letter-spacing:.5px}
.brand{font-size:56px;line-height:1;color:var(--tx)}.brand b{color:var(--rd)}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:11px 12px;margin:5px 0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gd);outline-offset:1px}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 16px;font-weight:600;background:var(--rd);color:#fff}
button.alt{background:var(--sf);border:1px solid var(--ln)}button.gd{background:var(--gd);color:#10200F}
button.full{width:100%;margin-top:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap;background:var(--sf);border:1px solid var(--ln)}
.chips button.on{background:var(--gd);color:#10200F;border-color:var(--gd)}
.mu{color:var(--mu);font-size:14px}.big{font-size:44px;line-height:1}
.bar{height:6px;background:var(--bg);border-radius:4px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.tag{font-size:13px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:1px 8px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center}
nav button{flex:1;max-width:120px;background:none;border-radius:0;color:var(--mu);padding:14px 4px}
nav button.on{color:var(--gd);box-shadow:inset 0 3px 0 var(--rd)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--ln)}
.ok{color:#5BD79B}.no{color:#FF7A89}.wt{color:var(--gd)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--gd);color:#10200F;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
.live{background:var(--rd);color:#fff;border-color:var(--rd);animation:pl 1.4s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px #F42A4144}}
.hot{color:#FF7A89;font-weight:700}
.pod{display:flex;gap:8px;align-items:flex-end;margin:12px 0}.pod>div{flex:1;text-align:center;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 4px}
.pod>.p1{padding-top:28px;border-color:var(--gd);box-shadow:0 0 18px #F5C45133}
.q{display:flex;gap:6px;flex-wrap:wrap}.q button{padding:6px 12px}
.cf{position:fixed;top:-30px;font-size:26px;z-index:9;pointer-events:none;animation:fall 1.9s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="auth" class="wrap" hidden>
  <div class="brand" style="margin-top:40px">VLX CLUB <b>BD</b></div>
  <p class="mu">ফ্রি ফায়ার টুর্নামেন্ট খেলুন, জিতুন, বিকাশ বা নগদে টাকা তুলুন।</p>
  <div class="card">
    <input id="nm" placeholder="আপনার নাম" autocomplete="name" hidden>
    <input id="ff" placeholder="ফ্রি ফায়ার UID" inputmode="numeric" hidden>
    <input id="em" type="email" placeholder="ইমেইল" autocomplete="email">
    <input id="pw" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="current-password">
    <button id="go" class="full">লগ ইন</button>
    <button id="gg" class="alt full">Google দিয়ে চালিয়ে যান</button>
    <button id="sw" class="alt full" style="border:0;background:none;color:var(--gd)">নতুন? অ্যাকাউন্ট খুলুন</button>
  </div>
</div>

<div id="app" hidden>
  <header class="wrap row" style="padding-bottom:0">
    <h1 style="font-size:30px">VLX CLUB <span style="color:var(--rd)">BD</span></h1>
    <span class="tag">ব্যালেন্স <b id="hb" class="wt"></b></span>
  </header>
  <main id="view" class="wrap"></main>
  <nav id="nav"></nav>
</div>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,collection,query,where,orderBy,limit,onSnapshot,runTransaction,serverTimestamp,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== এখানে আপনার Firebase কনফিগ বসান ===== */
const firebaseConfig={apiKey:"AIzaSyDJLo3RJ3TdfLrbZ1s_s8vENrc4MYM_xlw",authDomain:"vlx-club-bd.firebaseapp.com",projectId:"vlx-club-bd",storageBucket:"vlx-club-bd.firebasestorage.app",messagingSenderId:"32931476088",appId:"1:32931476088:web:b532ea7d1e77332f65b38d"};
/* ===== আপনার বিকাশ/নগদ পার্সোনাল নাম্বার ===== */
const PAY={'বিকাশ':'01789465013','নগদ':''};
const soon=m=>!PAY[m];
const MIN_DEP=50,MIN_WD=100;

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000)};
const tk=n=>'৳'+Number(n||0).toLocaleString('bn-BD');
const RANKS=[[0,'ব্রোঞ্জ','🥉'],[100,'সিলভার','🥈'],[300,'গোল্ড','🥇'],[700,'ডায়মন্ড','💎'],[1500,'হিরোইক','🔥']];
const rb=p=>{let r=RANKS[0];for(const x of RANKS)if((p||0)>=x[0])r=x;return r[2]+' '+r[1]};
const nxt=p=>RANKS.find(r=>r[0]>(p||0));
const left=t=>{const s=Math.floor((new Date(t)-Date.now())/1000);if(isNaN(s))return '';if(s<=0)return '🔴 LIVE';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return '⏱ '+(d?d+'দিন ':'')+(h||d?h+'ঘ ':'')+m+'মি '+(s%60)+'সে'};
setInterval(()=>document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=left(e.dataset.t)}),1000);
const boom=()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<30;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🎉','🔥','⭐','🏆'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2700)}};
const errMsg=x=>({'auth/invalid-credential':'ইমেইল বা পাসওয়ার্ড ভুল','auth/email-already-in-use':'এই ইমেইল আগেই ব্যবহার হয়েছে','auth/weak-password':'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর দিন','auth/invalid-email':'ইমেইল ঠিক নেই','auth/popup-closed-by-user':'Google লগ ইন বাতিল হয়েছে'}[x.code]||x.message);

const GROUPS={'সব':null,'BR':['BR Solo','BR Duo','BR Squad'],'Lone Wolf':['Lone Wolf 1v1','Lone Wolf 2v2','1 HP Lone Wolf'],'Clash Squad':['CS 1v1','CS 2v2','CS 4v4'],'ফলাফল':null};
const MODES=Object.values(GROUPS).flat().filter(Boolean);
let user=null,me={},admin=false,tab='home',grp='সব',tours=[],unsubs=[],signup=false,extra={};

/* ---------- Auth ---------- */
function authUI(){$('#nm').hidden=$('#ff').hidden=!signup;$('#go').textContent=signup?'রেজিস্টার করুন':'লগ ইন';$('#sw').textContent=signup?'আগে থেকেই অ্যাকাউন্ট আছে? লগ ইন':'নতুন? অ্যাকাউন্ট খুলুন'}
$('#sw').onclick=()=>{signup=!signup;authUI()};
$('#go').onclick=async()=>{try{const e=$('#em').value.trim(),p=$('#pw').value;
  if(signup){extra={name:$('#nm').value.trim(),ffUid:$('#ff').value.trim()};await createUserWithEmailAndPassword(auth,e,p)}
  else await signInWithEmailAndPassword(auth,e,p)}catch(x){toast(errMsg(x))}};
$('#gg').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){toast(errMsg(x))}};

async function ensureUser(u){const r=doc(db,'users',u.uid);if((await getDoc(r)).exists())return;
  await setDoc(r,{name:extra.name||u.displayName||'Player',ffUid:extra.ffUid||'',email:u.email,balance:0,points:0,wins:0,kills:0,createdAt:serverTimestamp()})}

onAuthStateChanged(auth,async u=>{unsubs.forEach(f=>f());unsubs=[];user=u;
  if(!u){$('#auth').hidden=false;$('#app').hidden=true;return}
  await ensureUser(u);
  admin=(await getDoc(doc(db,'admins',u.uid))).exists();
  $('#auth').hidden=true;$('#app').hidden=false;buildNav();
  unsubs.push(onSnapshot(doc(db,'users',u.uid),s=>{me=s.data()||{};$('#hb').textContent=tk(me.balance);render()}));
  unsubs.push(onSnapshot(query(collection(db,'tournaments'),orderBy('startTime')),s=>{tours=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='home')render()}));
});

/* ---------- Nav ---------- */
function buildNav(){const t=[['home','টুর্নামেন্ট'],['lb','লিডারবোর্ড'],['wallet','ওয়ালেট'],['profile','প্রোফাইল']];if(admin)t.push(['admin','অ্যাডমিন']);
  $('#nav').innerHTML=t.map(([k,l])=>`<button data-a="tab" data-k="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}
function render(){buildNav();(views[tab]||views.home)()}

/* ---------- Views ---------- */
const views={
home(){const res=grp==='ফলাফল',list=GROUPS[grp];const T=tours.filter(t=>res?t.status==='ended':t.status!=='ended'&&(!list||list.includes(t.mode)));
  $('#view').innerHTML=`<div class="chips">${Object.keys(GROUPS).map(g=>`<button data-a="grp" data-k="${g}" class="${g===grp?'on':''}">${g}</button>`).join('')}</div>`+
  (T.length?T.map(t=>`<div class="card"><div class="row"><h2 style="font-size:26px">${esc(t.title)}</h2><span class="tag">${esc(t.mode)}</span></div>
   <div class="row mu"><span>এন্ট্রি ফি: <b class="wt">${tk(t.fee)}</b></span><span>প্রাইজ: <b class="ok">${tk(t.prize)}</b></span></div>
   <div class="row"><span class="mu">শুরু: ${esc((t.startTime||'').replace('T',' '))}</span>${res?`<span class="tag wt">🏆 বিজয়ী: ${esc(t.winner||'—')}</span>`:`<span class="tag ${left(t.startTime).includes('LIVE')?'live':''}" data-t="${esc(t.startTime)}">${left(t.startTime)}</span>`}</div>
   <div class="bar"><i style="width:${Math.min(100,t.joined/t.slots*100)}%"></i></div>
   <div class="row"><span class="${t.slots-t.joined<=Math.ceil(t.slots*.25)&&t.joined<t.slots&&!res?'hot':'mu'}">${t.joined}/${t.slots} জন জয়েন${t.slots-t.joined<=Math.ceil(t.slots*.25)&&t.joined<t.slots&&!res?' · মাত্র '+(t.slots-t.joined)+'টি স্লট বাকি! 🔥':''}</span><span>
   <button class="alt" data-a="share" data-id="${t.id}">শেয়ার</button> <button class="alt" data-a="room" data-id="${t.id}">রুম দেখুন</button>
   <button data-a="join" data-id="${t.id}" ${t.joined>=t.slots||res?'disabled':''}>${res?'শেষ':t.joined>=t.slots?'স্লট পূর্ণ':'জয়েন করুন'}</button>
   ${admin?`<button class="alt" data-a="end" data-id="${t.id}">শেষ</button>`:''}</span></div></div>`).join('')
  :`<div class="card mu">এই ক্যাটাগরিতে এখন কোনো টুর্নামেন্ট নেই। পরে আবার দেখুন।</div>`)},

async lb(){$('#view').innerHTML='<p class="mu">লোড হচ্ছে…</p>';
  const s=await getDocs(query(collection(db,'users'),orderBy('points','desc'),limit(50)));let i=0;
  const U=s.docs.map(d=>({id:d.id,...d.data()}));
  const pd=[1,0,2].filter(k=>U[k]).map(k=>`<div class="${k?'':'p1'}"><div class="big num">${['🥇','🥈','🥉'][k]}</div><b>${esc(U[k].name)}</b><div class="wt num" style="font-size:26px">${U[k].points||0}</div><div class="mu">${rb(U[k].points)}</div></div>`).join('');
  $('#view').innerHTML=`<h2 style="font-size:32px;margin-top:8px">লিডারবোর্ড</h2><div class="pod">${pd}</div><div class="card"><table><tr><th>#</th><th>নাম</th><th>র‍্যাংক</th><th>জয়</th><th>পয়েন্ট</th></tr>`+
   U.map(u=>`<tr style="${u.id===user.uid?'background:#F5C45122':''}"><td class="num">${++i}</td><td>${esc(u.name)}</td><td>${rb(u.points)}</td><td>${u.wins||0}</td><td class="wt">${u.points||0}</td></tr>`).join('')+'</table></div>'},

async wallet(){const s=await getDocs(query(collection(db,'transactions'),where('uid','==',user.uid)));
  const H=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const opts=Object.keys(PAY).map(m=>`<option>${m}</option>`).join('');
  $('#view').innerHTML=`<div class="card"><div class="mu">আপনার ব্যালেন্স</div><div class="big num wt">${tk(me.balance)}</div></div>
  <div class="card"><h2 style="font-size:24px">ডিপোজিট</h2>
   <select id="dm">${opts}</select><p class="mu" id="dn"></p>
   <div class="q">${[50,100,200,500].map(x=>`<button class="alt" data-a="qa" data-v="${x}">${tk(x)}</button>`).join('')}</div><input id="da" type="number" placeholder="টাকার পরিমাণ (সর্বনিম্ন ${MIN_DEP})"><input id="dt" placeholder="Transaction ID (TrxID)">
   <button class="full" data-a="dep">ডিপোজিট রিকোয়েস্ট পাঠান</button></div>
  <div class="card"><h2 style="font-size:24px">উইথড্র</h2>
   <select id="wm">${opts}</select><input id="wa" type="number" placeholder="টাকার পরিমাণ (সর্বনিম্ন ${MIN_WD})"><input id="wn" inputmode="numeric" placeholder="আপনার বিকাশ/নগদ নাম্বার">
   <button class="gd full" data-a="wd">উইথড্র রিকোয়েস্ট পাঠান</button></div>
  <h2 style="font-size:24px">লেনদেনের ইতিহাস</h2><div class="card"><table>`+(H.map(h=>`<tr><td>${h.type==='deposit'?'ডিপোজিট':'উইথড্র'} (${esc(h.method)})</td><td>${tk(h.amount)}</td><td class="${h.status==='approved'?'ok':h.status==='rejected'?'no':'wt'}">${{pending:'অপেক্ষমাণ',approved:'সফল',rejected:'বাতিল'}[h.status]}</td></tr>`).join('')||'<tr><td class="mu">কোনো লেনদেন নেই</td></tr>')+'</table></div>';
  const sh=()=>{const m=$('#dm').value;$('#dn').innerHTML=soon(m)?`<b class="wt">${m} এখনো চালু হয়নি, কাজ চলছে। এখন বিকাশ ব্যবহার করুন।</b>`:`এই নাম্বারে <b class="wt">Send Money</b> করুন: <b>${PAY[m]}</b>`};$('#dm').onchange=sh;sh()},

profile(){$('#view').innerHTML=`<div class="card"><h2 style="font-size:24px">প্রোফাইল</h2><p class="mu">${esc(user.email)}</p>
  <input id="pn" value="${esc(me.name)}" placeholder="নাম"><input id="pf" value="${esc(me.ffUid)}" placeholder="ফ্রি ফায়ার UID" inputmode="numeric">
  <button class="full" data-a="save">সেভ করুন</button><button class="alt full" data-a="out">লগ আউট</button></div>
  ${(n=>`<div class="card"><div class="big">${rb(me.points)}</div><div class="bar"><i style="width:${n?Math.min(100,(me.points||0)/n[0]*100):100}%"></i></div><div class="mu">${n?'পরের র‍্যাংক '+n[1]+' এ যেতে আরও '+(n[0]-(me.points||0))+' পয়েন্ট':'আপনি সর্বোচ্চ র‍্যাংকে! 🔥'}</div></div>`)(nxt(me.points))}
  <div class="card row"><span>জয়: <b>${me.wins||0}</b></span><span>কিল: <b>${me.kills||0}</b></span><span>পয়েন্ট: <b class="wt">${me.points||0}</b></span></div>`},

async admin(){if(!admin)return;const s=await getDocs(query(collection(db,'transactions'),where('status','==','pending')));
  $('#view').innerHTML=`<div class="card"><h2 style="font-size:24px">নতুন টুর্নামেন্ট</h2>
  <input id="at" placeholder="টাইটেল"><select id="am">${MODES.map(m=>`<option>${m}</option>`).join('')}</select>
  <input id="af" type="number" placeholder="এন্ট্রি ফি"><input id="ap" type="number" placeholder="প্রাইজ"><input id="as" type="number" placeholder="স্লট সংখ্যা">
  <input id="ad" type="datetime-local"><input id="ar" placeholder="রুম ID"><input id="aw" placeholder="রুম পাসওয়ার্ড">
  <button class="full" data-a="mk">তৈরি করুন</button></div>
  <div class="card"><h2 style="font-size:24px">পয়েন্ট ও প্রাইজ যোগ</h2><input id="ue" type="email" placeholder="প্লেয়ারের ইমেইল">
  <input id="up" type="number" placeholder="পয়েন্ট"><input id="uw" type="number" placeholder="জয়"><input id="uk" type="number" placeholder="কিল"><input id="ub" type="number" placeholder="প্রাইজ টাকা (ব্যালেন্সে যাবে)">
  <button class="gd full" data-a="aw">যোগ করুন</button></div>
  <h2 style="font-size:24px">অপেক্ষমাণ রিকোয়েস্ট</h2>`+(s.docs.map(d=>{const t=d.data();return `<div class="card"><div class="row"><b>${t.type==='deposit'?'ডিপোজিট':'উইথড্র'} ${tk(t.amount)}</b><span class="tag">${esc(t.method)}</span></div>
   <div class="mu">${esc(t.name)} · ${t.type==='deposit'?'TrxID: '+esc(t.trx):'নাম্বার: '+esc(t.number)}</div>
   <div class="row" style="margin-top:8px"><button data-a="ok" data-id="${d.id}">অনুমোদন</button><button class="alt" data-a="rej" data-id="${d.id}">বাতিল</button></div></div>`}).join('')||'<div class="card mu">কোনো রিকোয়েস্ট নেই</div>')}
};

/* ---------- Actions ---------- */
const acts={
tab:d=>{tab=d.k;render()},
grp:d=>{grp=d.k;render()},
out:()=>signOut(auth),
async save(){try{await updateDoc(doc(db,'users',user.uid),{name:$('#pn').value.trim(),ffUid:$('#pf').value.trim()});toast('সেভ হয়েছে')}catch(x){toast(x.message)}},

async join(d){try{await runTransaction(db,async tx=>{const tr=doc(db,'tournaments',d.id),ur=doc(db,'users',user.uid),pr=doc(db,'tournaments',d.id,'players',user.uid);
  const [t,u,p]=await Promise.all([tx.get(tr),tx.get(ur),tx.get(pr)]);const T=t.data(),U=u.data();
  if(p.exists())throw Error('আপনি আগেই জয়েন করেছেন');if(!U.ffUid)throw Error('আগে প্রোফাইলে ফ্রি ফায়ার UID দিন');
  if(T.joined>=T.slots)throw Error('স্লট পূর্ণ');if(U.balance<T.fee)throw Error('ব্যালেন্স কম, আগে ডিপোজিট করুন');
  tx.update(ur,{balance:U.balance-T.fee});tx.update(tr,{joined:T.joined+1});tx.set(pr,{name:U.name,ffUid:U.ffUid,at:serverTimestamp()})});boom();toast('জয়েন সফল! রুম দেখুন 🔥')}catch(x){toast(x.message)}},

async room(d){try{const s=await getDoc(doc(db,'tournaments',d.id,'secret','room'));alert(s.exists()?`রুম ID: ${s.data().id}\nপাসওয়ার্ড: ${s.data().pass}`:'রুমের তথ্য এখনো দেওয়া হয়নি')}catch{toast('জয়েন করার পর রুম দেখা যাবে')}},

async dep(){const a=+$('#da').value,t=$('#dt').value.trim();if(soon($('#dm').value))return toast('নগদ এখনো চালু হয়নি, কাজ চলছে');if(a<MIN_DEP||!t)return toast(`সর্বনিম্ন ${tk(MIN_DEP)} এবং TrxID দিন`);
  try{await addDoc(collection(db,'transactions'),{uid:user.uid,name:me.name,type:'deposit',method:$('#dm').value,amount:a,trx:t,status:'pending',createdAt:serverTimestamp()});toast('রিকোয়েস্ট গেছে, অ্যাডমিন যাচাই করবে');views.wallet()}catch(x){toast(x.message)}},

async wd(){const a=+$('#wa').value,n=$('#wn').value.trim();if(soon($('#wm').value))return toast('নগদ এখনো চালু হয়নি, কাজ চলছে');if(a<MIN_WD||!n)return toast(`সর্বনিম্ন ${tk(MIN_WD)} এবং নাম্বার দিন`);
  try{await runTransaction(db,async tx=>{const ur=doc(db,'users',user.uid),u=await tx.get(ur);if(u.data().balance<a)throw Error('ব্যালেন্স কম');
   tx.update(ur,{balance:u.data().balance-a});tx.set(doc(collection(db,'transactions')),{uid:user.uid,name:me.name,type:'withdraw',method:$('#wm').value,amount:a,number:n,status:'pending',createdAt:serverTimestamp()})});
   toast('উইথড্র রিকোয়েস্ট গেছে');views.wallet()}catch(x){toast(x.message)}},

async mk(){try{const ref=await addDoc(collection(db,'tournaments'),{title:$('#at').value.trim(),mode:$('#am').value,fee:+$('#af').value,prize:+$('#ap').value,slots:+$('#as').value,joined:0,startTime:$('#ad').value,status:'open'});
  await setDoc(doc(ref,'secret','room'),{id:$('#ar').value.trim(),pass:$('#aw').value.trim()});toast('টুর্নামেন্ট তৈরি হয়েছে')}catch(x){toast(x.message)}},
end:async d=>{const w=prompt('বিজয়ীর নাম লিখুন');if(w===null)return;await updateDoc(doc(db,'tournaments',d.id),{status:'ended',winner:w.trim()}).catch(x=>toast(x.message))},

async aw(){try{const s=await getDocs(query(collection(db,'users'),where('email','==',$('#ue').value.trim())));if(s.empty)return toast('এই ইমেইলে প্লেয়ার নেই');
  await updateDoc(s.docs[0].ref,{points:increment(+$('#up').value||0),wins:increment(+$('#uw').value||0),kills:increment(+$('#uk').value||0),balance:increment(+$('#ub').value||0)});toast('যোগ হয়েছে')}catch(x){toast(x.message)}},

share:d=>{const t=tours.find(x=>x.id===d.id);const m=`🔥 ${t.title} (${t.mode}) — এন্ট্রি ${t.fee}৳, প্রাইজ ${t.prize}৳! VLX CLUB BD তে জয়েন করুন: ${location.href}`;navigator.share?navigator.share({text:m}).catch(()=>{}):open('https://wa.me/?text='+encodeURIComponent(m))},
qa:d=>{$('#da').value=d.v},
ok:d=>decide(d.id,true),rej:d=>decide(d.id,false)
};
async function decide(id,ok){try{await runTransaction(db,async tx=>{const r=doc(db,'transactions',id),t=await tx.get(r),T=t.data();if(T.status!=='pending')return;
  const ur=doc(db,'users',T.uid),u=await tx.get(ur),bal=u.data().balance;
  if((T.type==='deposit'&&ok)||(T.type==='withdraw'&&!ok))tx.update(ur,{balance:bal+T.amount});
  tx.update(r,{status:ok?'approved':'rejected'})});toast('সম্পন্ন');views.admin()}catch(x){toast(x.message)}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)acts[b.dataset.a]?.(b.dataset)});
authUI();
</script>
</body>
</html>
